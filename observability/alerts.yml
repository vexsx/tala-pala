# Alerting rules for the tala-pala stack.
#
# All expressions use the service-namespaced metric names (talapala_api_* from
# the Go API, talapala_prediction_* from the Python service). The legacy
# goldpred_* series are still exported but are deprecated and must not be used
# in new rules.
#
# Two deliberate design choices run through the file:
#
# 1. Market calendars are encoded in the expressions. Tehran trades Sat–Wed
#    (Thursday and Friday are closed) and USD_IRT only inside the session
#    window; global metals close Friday evening UTC and reopen Sunday night.
#    Without those guards every staleness rule would fire every weekend and be
#    muted within a month. day_of_week()/hour() are evaluated against
#    time() + 12600 (UTC+3:30) where a Tehran-local calendar is needed.
#
# 2. "Job stopped succeeding" and "job is failing" are separate rules, because
#    they fail in opposite directions. The last-success gauges live in process
#    memory, so after a restart a job that never succeeds again also never
#    publishes a series — staleness alone would stay silent forever. The
#    failure counters appear on the first failure and cover exactly that gap.
#
# Rules marked PENDING INSTRUMENTATION reference metrics that nothing writes
# yet; they evaluate to an empty vector and stay silent until the named
# producer is added. See docs/observability.md for the list.

groups:
  - name: tala-pala-freshness
    interval: 1m
    rules:
      # Freshness is read from the Go gauges rather than the Python ones: the
      # Go freshness job re-reads max(observed_at) from Postgres every 5
      # minutes, so the series survives a restart and reflects what is actually
      # stored. The Python gauge is only set by a successful collect pass.
      - alert: IranGold18kPriceStale
        expr: |
          (time() - talapala_api_last_price_timestamp_seconds{symbol="IR_GOLD_18K"} > 2700)
            and on()
          (day_of_week(vector(time() + 12600)) < 4 or day_of_week(vector(time() + 12600)) > 5)
        for: 15m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "IR_GOLD_18K has not been priced for {{ $value | humanizeDuration }}"
          description: >-
            The headline symbol is stale on a Tehran trading day (it trades 24h
            Sat–Wed). Collection runs every 10 minutes, so 45 minutes means the
            chain is broken. Check `docker compose logs prediction-service |
            grep -i collect`, then GET /internal/providers/health on the
            prediction service — the 18k providers (hamrahgold, milligold,
            tgju) fail over by priority, so all of them are down or the collect
            job itself is not running.

      - alert: UsdIrtPriceStale
        expr: |
          (time() - talapala_api_last_price_timestamp_seconds{symbol="USD_IRT"} > 2700)
            and on()
          (day_of_week(vector(time() + 12600)) < 4 or day_of_week(vector(time() + 12600)) > 5)
            and on()
          (hour(vector(time() + 12600)) >= 13 < 20)
        for: 15m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "USD_IRT has not been priced for {{ $value | humanizeDuration }}"
          description: >-
            USD_IRT is stale during the Tehran session (MARKET_TEHRAN_OPEN..
            CLOSE, default 12:00–20:00 local; the rule waits until 13:00 local
            so it cannot trip on the first tick after open). Every IRT-quoted
            forecast depends on this rate. Check the fx providers via
            GET /internal/providers/health and the collect job logs.

      - alert: GlobalGoldPriceStale
        expr: |
          (time() - talapala_api_last_price_timestamp_seconds{symbol="XAUUSD"} > 10800)
            and on()
          (day_of_week() > 0 < 6)
        for: 20m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "XAUUSD has not been priced for {{ $value | humanizeDuration }}"
          description: >-
            Global gold is a model input, not a served price, hence warning.
            The 3h threshold is what keeps the Friday 21:00 UTC close from
            tripping the rule before the Saturday/Sunday suppression takes
            over — do not lower it without adding a proper session guard.
            Check the global_gold providers (GET /internal/providers/health);
            TGJU's 'ons' quote is the fallback and lags 30–60 minutes.

      - alert: MetricsTargetDown
        expr: up{job=~"api|prediction-service"} == 0
        for: 5m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
          description: >-
            Every other rule in this file goes silent when its target stops
            being scraped, so this is the rule that prevents a blind spot.
            Check `docker compose ps` and the container's healthcheck; if the
            service is up, confirm it still answers /metrics (api:8080) or
            /internal/metrics (prediction-service:8500) on the internal network.

  - name: tala-pala-jobs
    interval: 1m
    rules:
      - alert: ScheduledJobFailing
        expr: increase(talapala_api_job_failure_total{job=~"collect|predict|train|cleanup"}[30m]) > 0
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Scheduled job {{ $labels.job }} failed in the last 30 minutes"
          description: >-
            Counts real failures, timeouts and runs skipped because the Redis
            lock could not be taken. Check `docker compose logs api | grep -E
            'job_failed|job_lock'` and the Issues tab in the UI (WARN+ logs are
            mirrored into app_issues). A lock_held reason on a single-replica
            deployment means a previous run was killed and its lock is still
            counting down.

      - alert: CollectJobNotSucceeding
        expr: time() - talapala_api_job_last_success_timestamp_seconds{job="collect"} > 2700
        for: 15m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "collect has not succeeded for {{ $value | humanizeDuration }}"
          description: >-
            The collect cron runs every 10 minutes (SCHEDULE_COLLECT_CRON), so
            45 minutes without a success means the prediction service is
            rejecting the call or every provider is failing. Check
            `docker compose logs api | grep job_failed` and the reachability of
            prediction-service:8500 from the api container.

      - alert: PredictJobNotSucceeding
        expr: time() - talapala_api_job_last_success_timestamp_seconds{job="predict"} > 10800
        for: 30m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "predict has not succeeded for {{ $value | humanizeDuration }}"
          description: >-
            The predict cron runs hourly (SCHEDULE_PREDICT_CRON) and covers
            feature generation plus the prediction pass, so the served forecast
            is going stale. Check `docker compose logs api | grep job_failed`;
            a feature-generation failure usually points at missing recent
            prices, so verify the freshness alerts above first.

      - alert: TrainJobNotSucceeding
        expr: time() - talapala_api_job_last_success_timestamp_seconds{job="train"} > 108000
        for: 1h
        labels:
          severity: warning
          service: api
        annotations:
          summary: "train has not succeeded for {{ $value | humanizeDuration }}"
          description: >-
            Training runs nightly at 02:30 UTC (SCHEDULE_TRAIN_CRON) and takes
            30–36 minutes; 30 hours means at least one night was missed and the
            active models are drifting away from the current regime. Check
            `docker compose logs api | grep -E 'train|job_failed'` — a run
            exceeding the 90-minute internal-client timeout shows up as a
            failure here while Python is still working.

      - alert: CleanupJobNotSucceeding
        expr: time() - talapala_api_job_last_success_timestamp_seconds{job="cleanup"} > 108000
        for: 1h
        labels:
          severity: warning
          service: api
        annotations:
          summary: "cleanup has not succeeded for {{ $value | humanizeDuration }}"
          description: >-
            Retention runs nightly at 04:00 UTC (SCHEDULE_CLEANUP_CRON). While
            it is down, raw_observations and predictions grow without bound and
            the disk shared with Postgres fills. Check
            `docker compose logs api | grep job_failed` and current table sizes.

      # PENDING INSTRUMENTATION — scripts/backup.sh is a host cron outside the
      # compose network and reports success to nothing. This rule stays silent
      # until the script publishes a timestamp (node_exporter textfile
      # collector or a Pushgateway); a silent rule is the correct interim
      # state, an absent()-based one would fire forever and train the operator
      # to ignore it.
      - alert: DatabaseBackupStale
        expr: time() - talapala_backup_last_success_timestamp_seconds > 108000
        for: 30m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "No successful database backup for {{ $value | humanizeDuration }}"
          description: >-
            The nightly pg_dump has not reported success in over 30 hours.
            Check /var/log/tala-pala-backup.log on the host, that the cron entry
            in /etc/cron.d/ still exists, and that BACKUP_RSYNC_TARGET is
            reachable — an off-host copy is the only one that survives the host.

  - name: tala-pala-models
    interval: 1m
    rules:
      # PENDING INSTRUMENTATION — needs a per (symbol, horizon) gauge set to 1
      # when the active model_versions row has a readable artifact under
      # MODELS_DIR and 0 when it does not.
      - alert: ActiveModelArtifactMissing
        expr: talapala_prediction_active_model_artifact == 0
        for: 15m
        labels:
          severity: critical
          service: prediction
        annotations:
          summary: "No usable artifact for the active model {{ $labels.symbol }}/{{ $labels.horizon }}"
          description: >-
            The database marks a model version active but its artifact cannot
            be loaded, so predictions for that horizon fall back or fail. Check
            that the `models` volume is mounted at MODELS_DIR in the
            prediction-service container and that the file the active
            model_versions row points at exists; if not, trigger a retrain
            (`make train`).

      # PENDING INSTRUMENTATION — needs a gauge carrying the live interval
      # coverage that jobs/evaluate.py already writes to
      # app_settings['live_calibration'], labelled by horizon.
      - alert: PredictionIntervalCoverageDegraded
        expr: talapala_prediction_interval_coverage < 0.75
        for: 2h
        labels:
          severity: warning
          service: prediction
        annotations:
          summary: "Live interval coverage for {{ $labels.horizon }} is {{ $value | humanizePercentage }}"
          description: >-
            Realized coverage of the nominal 90% interval has fallen below the
            0.75 floor (COVERAGE_FLOOR in models/predicting.py), so published
            intervals are too narrow for the current regime. The system widens
            them automatically up to 1.5x — this alert means that cap is
            probably being hit. Check the evaluate job is running, then compare
            recent sMAPE (talapala_prediction_model_smape) against the last
            training run: a regime change usually needs a retrain, not a wider
            interval.

  - name: tala-pala-economic
    interval: 1m
    rules:
      # Self-gating in the same way the news rule is: the Python-side gauge is
      # only advanced when a pass had NO per-series errors, and the series never
      # exists until the first clean run, so a deployment that has not ingested
      # yet never alerts.
      #
      # 26h, not 24h: the job runs daily at 03:40 UTC, so a single missed run
      # must be visible without a routine 24h-boundary flap.
      - alert: EconomicIngestNotSucceeding
        expr: time() - talapala_prediction_job_last_success_timestamp_seconds{job="economic"} > 93600
        for: 30m
        labels:
          severity: warning
          service: prediction
        annotations:
          summary: "Economic-series ingestion has not cleanly succeeded for {{ $value | humanizeDuration }}"
          description: >-
            Either api.worldbank.org / imf.org are unreachable from this host, or
            a series is failing its own guard — a World Bank rebase refuses the
            series by design rather than storing restated levels under a stale
            base_period label. This never blocks price collection, prediction or
            training: the job has its own lock and timeout. Check
            `docker compose logs prediction-service | grep -i economic` and the
            consecutive_failures column in data_providers for 'worldbank' and
            'imf_weo'.

  # ---------------------------------------------------------------------------
  # The MANUALLY REFRESHED data classes.
  #
  # Everything else in this file watches something that runs on the server. The
  # two datasets below do not, and cannot: neither source is reachable from the
  # production host, measured rather than assumed. amar.org.ir accepts TCP on
  # 443 and 80 and then answers nothing — no TLS handshake completes and plain
  # HTTP returns nothing either, which is application-layer filtering.
  # cdn.tsetmc.com fails TCP 443 outright (http=000) while answering fine from
  # outside that network. So both are fetched elsewhere and pushed, by
  # scripts/sci_fetch.py and scripts/tsetmc_fetch.py.
  #
  # That architecture is right. What was missing is that nothing SCHEDULES
  # those runs and nothing NOTICED when they stopped. On 2026-09-24 the newest
  # equity bar in production was 2026-09-09 — fifteen days — and the screener
  # had been serving those prices under a window labelled with the current date
  # the whole time. The only reason anyone knew is that a human went looking.
  #
  # Self-gating, in the same way the news and economic rules are: the gauges
  # are published per row returned by a GROUP BY, so a deployment that has
  # never ingested an equity bar or an economic observation produces no series
  # and never alerts. That is a property of the producer (see the
  # no-row-no-gauge rule in backend-go/internal/alerts/runner.go), not of these
  # expressions, and it is the reason none of them uses absent().
  - name: tala-pala-manual-refresh
    interval: 1m
    rules:
      - alert: EquityBarsStale
        # The bound is the API's, expressed in the units this gauge actually
        # carries, and the conversion is the whole reason for this comment.
        #
        # data_age.stale_after_days is 10 (equityStaleAfterDays in
        # backend-go/internal/equities/handlers.go) and the API marks data
        # stale on `days > 10`, so the first STALE age is ELEVEN days; ten days
        # exactly is still fresh, which handlers' own dataage_test.go asserts
        # under the name "the bound itself must not be stale".
        #
        # The gauge is a DATE floored to midnight UTC while time() is a wall
        # clock, so age-in-seconds equals days x 86400 exactly. `> 864000`
        # therefore became true one second after midnight on day TEN and paged
        # an operator a full day before /stocks/screen would admit anything was
        # wrong -- they would open the page and read "stale": false. That is
        # precisely the disagreement this rule claims to prevent, so the bound
        # is 11 x 86400 and the comparison is >=, which is `days >= 11` and
        # therefore the API's `days > 10`, exactly.
        #
        # Eleven is also what the market data says independently. Across every
        # distinct session since 2016 (2,571 gaps, measured on production
        # 2026-09-24) the longest closure is exactly 10 days and NOTHING
        # exceeds it: 0 gaps over 10 days, 2 gaps of exactly 10 (Nowruz 2016
        # and 2021), 84 over 3 days. So at 11 days no market closure on record
        # can fire this rule at all -- only a refresh that stopped.
        expr: time() - talapala_api_last_equity_bar_roster_timestamp_seconds >= 950400
        for: 1h
        labels:
          severity: warning
          service: api
        annotations:
          summary: "No new Tehran equity bar for {{ $value | humanizeDuration }}"
          description: >-
            WHY ELEVEN DAYS. The Tehran exchange trades Saturday to Wednesday,
            so the newest bar is routinely 2 days old on Friday and 3 on
            Saturday morning before the session lands; a public holiday against
            a weekend stretches that to about 5. A naive 24h bound would page
            every single weekend — the mistake that already makes 38 of the
            last 48 warnings closed-market noise. On top of the calendar the
            refresh is MANUAL and its documented cadence is weekly
            (docs/deployment.md): a run on Friday can only ingest through the
            Wednesday session, so it stores a bar that is ALREADY 2 days old
            and the newest bar reaches 9 days immediately before the next
            on-time run. Nine, not the 7–8 an earlier draft of this comment
            claimed — that understated the worst case and hid how little
            headroom the bound has. Eleven days clears an on-time weekly
            cadence by about a day and a half, and sits well below the fifteen
            measured on 2026-09-24, so this rule would have caught that.
            NOWRUZ. The annual New Year closure is the longest of the year and
            was the expected false positive here. Measured rather than
            assumed, it is not one: the 2016 and 2021 closures are 10 days,
            the longest on record since 2016, and this bound is 11. What can
            still fire in that window is the MANUAL REFRESH not being run once
            the market reopens — which is a true positive, because at that
            point the data really is stale. Note there is no way to silence
            this: observability/prometheus.yml deploys no Alertmanager and says
            so, and silences are an Alertmanager feature. Until one exists,
            these rules are visible only on Prometheus /alerts and reach nobody
            on their own — so do not read a quiet week as a healthy one.
            TO FIX: run `make refresh-equities` — NOT on the server, which
            cannot reach cdn.tsetmc.com (TCP 443 fails outright), but from a
            host that can. It fetches the roster from the server, downloads the
            bars, copies them back and triggers the ingest. `make
            refresh-offserver` does this and the SCI CPI refresh together.
            If the script itself is failing, check
            `docker compose logs prediction-service | grep -i equit` for a
            refused ingest.

      - alert: EquityInstrumentBarsStale
        # One symbol left behind while the roster advances. Gated on the roster
        # gauge being FRESH so this can never fire alongside the rule above:
        # when the refresh stops, every symbol goes stale at once, and reporting
        # that as ~700 per-symbol notifications would bury the one line that
        # says what happened. This fires only for the other shape — the fetch
        # is running and one instrument is not coming back with it.
        # min() rather than a bare comparison on the right: it collapses to one
        # label-free series whatever the api replica count, so the guard cannot
        # become a many-to-many match if this is ever scaled past one. It is
        # still empty when no equity bar has ever been stored, which keeps this
        # rule self-gating through the roster gauge as well as its own.
        expr: |
          (time() - talapala_api_last_equity_bar_timestamp_seconds > 2592000)
            and on()
          (min(time() - talapala_api_last_equity_bar_roster_timestamp_seconds) < 950400)
        for: 2h
        labels:
          severity: warning
          service: api
        annotations:
          summary: "{{ $labels.symbol }} has had no new bar for {{ $value | humanizeDuration }} while the roster keeps updating"
          description: >-
            The equity refresh IS running — the roster's newest bar is current
            — but this one instrument has not received a session in 30 days.
            Thirty, not ten, because a long trading suspension is the common
            benign cause on this exchange and is the known false positive here;
            check whether the symbol is suspended before assuming the fetch
            broke. The other likely cause is real and silent: TSETMC reuses a
            symbol across insCodes when an instrument is re-listed, so a stored
            ins_code can stop being the one TSETMC serves and the fetch keeps
            succeeding for every other symbol. Compare this symbol against
            GET /api/v1/stocks (its last_bar and bar_count) and re-run
            `make refresh-equities ARGS="--ins-code <code>"` for it alone. The
            ARGS= wrapper is not optional: make parses its own options first,
            so the bare `--ins-code` form exits 2 with "unrecognized option"
            before running anything.

      - alert: SciCpiIngestStale
        # Forty-five days. Measured in weeks because the publisher works in
        # months: SCI puts out the urban CPI workbook once per Jalali month,
        # weeks after the period it describes — the Mordad 1405 edition covers
        # a period that ended 2026-08-22 and stamps 1405/06/18 in its own
        # filename. Consecutive available_at values are therefore ~30 days
        # apart in perfectly healthy operation, and an hours-based bound would
        # be meaningless here. 45 days means a whole monthly release came and
        # went without being fetched.
        expr: time() - talapala_api_last_economic_observation_timestamp_seconds{provider="sci"} > 3888000
        for: 6h
        labels:
          severity: warning
          service: api
        annotations:
          summary: "No new SCI economic observation for {{ $value | humanizeDuration }}"
          description: >-
            The gauge carries available_at — when this system could first have
            known the value — and NOT ref_period_end. That distinction is the
            rule's correctness: a healthy SCI pipeline is permanently weeks
            behind the period it describes, so a ref_period_end bound could not
            tell it apart from a dead one.
            WHY ONLY provider="sci". The same gauge is published for worldbank
            and imf_weo, and they are deliberately not alerted on: their series
            are annual, so available_at legitimately does not advance for
            months and a 45-day bound would fire on them all year. Their daily
            ingest job has its own rule, EconomicIngestNotSucceeding, which
            watches the job rather than the data.
            TO FIX: run `make refresh-cpi` — NOT on the server, which cannot
            reach amar.org.ir (TCP connects, nothing answers), but from a host
            that can. `make refresh-offserver` does this and the equity refresh
            together. If SCI has genuinely not published, confirm on
            https://amar.org.ir/prices before treating this as a fault.

  - name: tala-pala-news
    interval: 1m
    rules:
      # Self-gating: JOB_LAST_SUCCESS{job="news"} only exists once a news run
      # has succeeded, so deployments running with NEWS_COLLECTION_ENABLED=false
      # (the default) never produce a series and never alert.
      - alert: NewsCollectionFailing
        expr: time() - talapala_prediction_job_last_success_timestamp_seconds{job="news"} > 21600
        for: 30m
        labels:
          severity: warning
          service: prediction
        annotations:
          summary: "News ingestion has not succeeded for {{ $value | humanizeDuration }}"
          description: >-
            News ingestion is not scheduled by the Go cron — it is driven by
            POST /internal/news/ingest — so this fires either because whatever
            calls that endpoint stopped, or because every approved source is
            failing. Check `docker compose logs prediction-service | grep -i
            news` and the consecutive_failures column in news_sources.

      # PENDING INSTRUMENTATION — needs a gauge per source code carrying
      # news_sources.last_success_at (the column jobs/news.py already updates).
      - alert: NewsSourceStale
        expr: time() - talapala_prediction_news_source_last_success_timestamp_seconds > 86400
        for: 1h
        labels:
          severity: warning
          service: prediction
        annotations:
          summary: "News source {{ $labels.source }} has not delivered for {{ $value | humanizeDuration }}"
          description: >-
            One approved source has been silent for a day while others keep
            working, which usually means a feed URL moved, a robots/policy
            change, or repeated fetch errors. Check consecutive_failures and
            policy_status for that code in news_sources; a source disabled on
            purpose should be marked enabled=false so it stops being scraped
            and stops alerting.
